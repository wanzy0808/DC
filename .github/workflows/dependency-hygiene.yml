name: Dependency Hygiene

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-hygiene.yml"

permissions:
  contents: write

jobs:
  sync-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Trim unused runtime dependencies
        run: |
          pnpm remove @hugeicons/core-free-icons @hugeicons/react class-variance-authority shadcn dotenv
          pnpm add -D shadcn@^4.19.0 dotenv@^17.4.2
          pnpm install --frozen-lockfile

      - name: Commit synchronized manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: trim unused runtime dependencies"
          git push origin HEAD:main
