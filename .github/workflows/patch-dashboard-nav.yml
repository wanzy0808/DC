name: Patch dashboard navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-dashboard-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/[dashboard]/page.tsx')
          s = p.read_text()

          s = s.replace('const canDigital=ctx?.entitlements.hasDigitalInvitation??false; const canGuestbook=ctx?.entitlements.hasGuestbook??false; const accent=isDarkMode?', 'const canDigital=ctx?.entitlements.hasDigitalInvitation??false; const canGuestbook=ctx?.entitlements.hasGuestbook??false; const accent=isDarkMode?')
          s = s.replace(' const surface=isDarkMode?"bg-[#0B0A0E]":"bg-[#FAF7F2]"; const title=nav.find(n=>n.id===tab)?.label??"Rangkaian Acara";', ' const surface=isDarkMode?"bg-[#0B0A0E]":"bg-[#FAF7F2]";')

          old_nav = '<nav className="flex-1 space-y-1 p-3"><p className="px-3 pb-3 pt-3 font-[family-name:var(--font-cinzel)] text-[10px] font-semibold uppercase tracking-[0.2em] text-[#5A4545] dark:text-white/75">Workspace</p>{nav.map(item=>{const Icon=item.icon;const locked=item.gate==="guestbook"&&!canGuestbook;return <button key={item.id} onClick={()=>go(item.id)}'
          new_nav = '<nav className="flex-1 space-y-1 p-3"><Link href="/dashboard" className="mb-2 flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left font-[family-name:var(--font-cinzel)] text-[11px] font-semibold text-[#3F3030] hover:bg-[#7A1C25]/7 dark:text-[#F0E5E5] dark:hover:bg-white/5"><CalendarDays className="h-4 w-4"/><span>Beranda</span></Link><p className="px-3 pb-3 pt-3 font-[family-name:var(--font-cinzel)] text-[10px] font-semibold uppercase tracking-[0.2em] text-[#5A4545] dark:text-white/75">Workspace</p>{nav.map(item=>{const Icon=item.icon;const locked=item.gate==="guestbook"&&!canGuestbook;return <button key={item.id} onClick={()=>go(item.id)}'
          if old_nav not in s:
              raise SystemExit('sidebar anchor not found')
          s = s.replace(old_nav, new_nav, 1)

          old_header = '<div className="hidden font-[family-name:var(--font-cinzel)] text-sm font-semibold tracking-[0.08em] text-[#7A1C25] dark:text-[#E8A5AE] lg:block">{title}</div>'
          if old_header not in s:
              raise SystemExit('dynamic header title not found')
          s = s.replace(old_header, '<div className="hidden lg:block" />', 1)

          old_main = '<main><div className="border-b border-[#ddd0c8] px-5 py-4 dark:border-white/10 sm:px-8"><p className="font-[family-name:var(--font-cinzel)] text-[10px] font-semibold uppercase tracking-[0.2em] text-[#5A4545] dark:text-white/75">DC Wedding Workspace</p><h1 className="mt-1 font-[family-name:var(--font-fauna)] text-xl font-medium">{title}</h1></div>'
          if old_main not in s:
              raise SystemExit('main dynamic title block not found')
          s = s.replace(old_main, '<main>', 1)

          p.write_text(s)
          PY
      - name: Commit dashboard patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/[dashboard]/page.tsx'
          git commit -m 'fix dashboard navigation and remove dynamic titles'
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/patch-dashboard-nav.yml
          git add .github/workflows/patch-dashboard-nav.yml
          git commit -m 'chore: remove temporary dashboard patch workflow'
          git push
