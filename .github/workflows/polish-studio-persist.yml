name: Polish Studio Persistence
on:
  push:
    paths:
      - .github/workflows/polish-studio-persist.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch studio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/InvitationStudio/InvitationDesigner.tsx')
          s = p.read_text()
          s = s.replace('const p=parseDesignKey(i.templateKey);setDesign({template:p.template,palette:p.palette,font:p.font,decor:i.assets.find(a=>a.type==="IMAGE")?.url||decor[0]});', 'const p=parseDesignKey(i.templateKey);setDesign({template:p.template,palette:p.palette,font:p.font,decor:p.decor||i.assets.find(a=>a.type==="IMAGE")?.url||decor[0]});')
          s = s.replace('designKey=makeDesignKey(design.template,design.palette,design.font);', 'designKey=makeDesignKey(design.template,design.palette,design.font,design.decor);')
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/InvitationStudio/InvitationDesigner.tsx .github/workflows/polish-studio-persist.yml
          git commit -m "Persist studio decoration selection" || exit 0
          git rm .github/workflows/polish-studio-persist.yml
          git commit -m "Remove temporary studio patch workflow"
          git push
