name: Apply Published Event Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-published-event-lock.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply event lock and documentation
        run: python .github/scripts/apply-published-event-lock.py

      - name: Commit changes and clean temporary files
        shell: bash
        run: |
          git config user.name "dc-organizer-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/scripts/apply-published-event-lock.py
          git rm .github/workflows/apply-published-event-lock.yml
          git add app/api/invitations/route.ts components/Dashboard/EventPanel.tsx prd.md AGENTS.md README.md prd1.md
          git commit -m "feat: lock published events and add delete flow"
          git push origin HEAD:main
