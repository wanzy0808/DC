name: Record Landing Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-landing-polish.yml'

permissions:
  contents: write

jobs:
  record:
    if: github.event.head_commit.message == 'chore: append landing polish changelog'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Append implementation changelog and remove one-shot workflow
        shell: bash
        run: |
          cat >> prd1.md <<'EOF'

