name: UI Workspace Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-workspace-audit.yml'
      - '.github/scripts/ui_workspace_polish.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Apply workspace corrections
        run: python .github/scripts/ui_workspace_polish.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build corrected source
        run: pnpm build

      - name: Commit implementation
        id: implementation
        shell: bash
        run: |
          git config user.name "dc-organizer-agent"
          git config user.email "actions@users.noreply.github.com"
          git add app/dashboard components/Dashboard AGENTS.md prd.md README.md prd-tambahan.md
          if git diff --cached --quiet; then
            echo "No implementation changes produced."
            exit 1
          fi
          git commit -m "fix: restore wide dashboard workspace"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record implementation changelog
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          sha = os.environ["IMPLEMENTATION_SHA"]
          path = Path("prd1.md")
          text = path.read_text(encoding="utf-8").rstrip()
          entry = f'''\n\n---\n\n## 2026-09-17 — Desktop Workspace Width & Decorative Number Cleanup\n\n### Requirement / Intent\nMengikuti koreksi terbaru user dan desktop agent rule: halaman desktop tidak boleh kembali ke container lama yang hanya memakai sebagian kecil layar, primary desktop container menargetkan 80vw tanpa fixed `1400px` ceiling, dan customer-facing page/component copy tidak memakai nomor urutan dekoratif. Angka yang merupakan data nyata tetap dipertahankan.\n\n### Implementation\n- mengganti wrapper dashboard `92vw / 1400px` dengan workspace desktop 80vw yang tetap dibatasi available main-pane width;\n- menjaga dashboard chrome/background selebar viewport sambil mencegah sidebar menyebabkan horizontal overflow;\n- menyelaraskan Beranda, header tab, Undangan, Personal Invitation, WA Blast, RSVP, Manajemen Tamu, Usher, dan feature gate ke aturan width yang sama;\n- menghapus label dekoratif seperti `Workspace / 01`, `Acara / 02`, nomor urutan card undangan/acara, serta fallback title berbasis index;\n- mempertahankan angka bermakna seperti tanggal, waktu, harga, jumlah tamu, quota, kapasitas, child order, nomor telepon, dan metrics;\n- menyinkronkan requirement ke `AGENTS.md`, `prd.md`, `README.md`, dan supplemental `prd-tambahan.md` sesuai permintaan user.\n\n### Affected Files\n- `app/dashboard/layout.tsx`\n- `app/dashboard/page.tsx`\n- dashboard components yang masih memakai legacy `92vw / 1400px` wrapper\n- `components/Dashboard/EventPanel.tsx`\n- `components/Dashboard/InvitationWorkspacePanel.tsx`\n- `components/Dashboard/WhatsAppBlastPanel.tsx`\n- `components/Dashboard/EventScopePicker.tsx`\n- `AGENTS.md`\n- `prd.md`\n- `README.md`\n- `prd-tambahan.md`\n- `prd1.md`\n\n### Commit\n- `{sha}` — restore wide dashboard workspace and remove decorative sequence numbering.\n\n### Validation\n- `pnpm install --frozen-lockfile`: **PASS** in one-shot GitHub Actions workspace-polish job before implementation commit.\n- `pnpm build`: **PASS** in the same job against the corrected source before implementation commit.\n- Targeted decorative numbering guard across `app/**/*.tsx` and `components/**/*.tsx`: **PASS** for the prohibited patterns covered by this change.\n- Database migration: N/A.\n'''
          path.write_text(text + entry + "\n", encoding="utf-8")
          PY
          git add prd1.md
          git commit -m "docs: record dashboard workspace polish"
          git push origin HEAD:main