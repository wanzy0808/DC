name: Record Integrated Landing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-integrated-landing.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync master PRD and implementation changelog
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('prd.md'); s=p.read_text(); old='- Public content standard sekitar `w-[min(92vw,1400px)]` saat sesuai.'; new='- Primary public desktop header/content/footer containers target **80vw**; jangan mengembalikan fixed `1400px` public-page cap yang membuang ruang wide-screen.'; s=s.replace(old,new); marker='- Pintu tetap core public navigation surface.'; extra='- Landing 80vw harus memperlakukan copy + Pintu sebagai satu komposisi: orbit dapat melebar dan carousel dapat masuk ke arah copy selama responsive clipping tetap aman.\n- Public burger menu memakai navigation-button treatment, mempertahankan `Layanan` dengan submenu Event Planner / Digital Invitation / Guestbook, serta selalu menyediakan `Masuk` dan `Daftar`; decorative numbering tidak digunakan.'; s=s.replace(marker, marker+'\n'+extra) if extra not in s else s; p.write_text(s)"
          echo '' | base64 -d >> prd1.md
          git config user.name "dc-organizer-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/record-integrated-landing.yml
          git add prd.md prd1.md
          git commit -m "docs: record integrated landing composition"
          git push origin HEAD:main
