name: Convert public PNG assets to WebP

on:
  push:
    branches:
      - main
    paths:
      - "public/**/*.png"

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/dc_ci

      - name: Convert PNG assets and update references
        run: node scripts/convert-public-png-to-webp.mjs

      - name: Verify no public PNG remains
        shell: bash
        run: |
          set -euo pipefail
          count="$(find public -type f -iname '*.png' | wc -l | tr -d ' ')"
          echo "Remaining public PNG files: $count"
          test "$count" = "0"

      - name: Source regression tests
        run: pnpm test

      - name: Verify application build
        run: pnpm build

      - name: Commit converted assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi

          git config user.name "Undara Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Convert public PNG assets to WebP"
          git push origin HEAD:main
