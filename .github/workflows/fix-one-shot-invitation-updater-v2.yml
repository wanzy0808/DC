name: Fix one-shot invitation updater v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-one-shot-invitation-updater-v2.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch updater workflow safely
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/one-shot-invitation-family-time.yml')
          text = path.read_text()
          marker = '          # API accepts a persisted END sentinel in the existing compatibility time field.\n'
          insertion = """          replace_once(
              \"components/Dashboard/EventPanel.tsx\",
              '        <Input\\n          disabled={disabled}\\n          inputMode=\"numeric\"\\n          maxLength={10}\\n',
              '        <Input\\n          inputMode=\"numeric\"\\n          maxLength={10}\\n',
          )
          replace_once(
              \"components/Dashboard/EventPanel.tsx\",
              '        <Input\\n          inputMode=\"numeric\"\\n          maxLength={5}\\n',
              '        <Input\\n          disabled={disabled}\\n          inputMode=\"numeric\"\\n          maxLength={5}\\n',
          )

"""
          if marker not in text:
              raise SystemExit('Updater marker not found')
          if 'maxLength={10}' in text and 'maxLength={5}' in text and 'Patch DateField/TimeField disabled placement' in text:
              raise SystemExit('Updater already patched')
          insertion = '          # Patch DateField/TimeField disabled placement.\n' + insertion
          path.write_text(text.replace(marker, insertion + marker, 1))
          PY
      - name: Commit updater fix and cleanup helper workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-one-shot-invitation-updater.yml
          rm -f .github/workflows/fix-one-shot-invitation-updater-v2.yml
          git add .github/workflows/one-shot-invitation-family-time.yml .github/workflows/fix-one-shot-invitation-updater.yml .github/workflows/fix-one-shot-invitation-updater-v2.yml
          git commit -m "fix one-shot invitation updater input patch"
          git push origin HEAD:main
