name: Restore Dashboard Brand

on:
  push:
    paths:
      - '.github/workflows/restore-dashboard-brand.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Restore canonical dashboard brand lockup
        run: python .github/scripts/restore-dashboard-brand.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/dc_ci

      - name: Build
        run: pnpm build

      - name: Commit validated brand restore
        run: |
          rm -f .github/scripts/restore-dashboard-brand.py
          rm -f .github/workflows/restore-dashboard-brand.yml
          git config user.name 'dc-organizer-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore canonical dashboard brand lockup'
          git push
