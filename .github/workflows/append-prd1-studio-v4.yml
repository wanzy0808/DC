name: Append Studio V4 Changelog

on:
  push:
    branches:
      - fix/studio-template-canvas-sections
    paths:
      - .github/workflows/append-prd1-studio-v4.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Append prd1 implementation entry
        shell: bash
        run: |
          if grep -q "Invitation Studio Live Canvas V4" prd1.md; then
            echo "Entry already exists."
            exit 0
          fi
          echo "" | base64 -d >> prd1.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prd1.md
          git commit -m "record invitation studio live canvas v4"
          git push
