name: Apply Auth Guest Foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-auth-guest-foundation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply docs and guest foundation
        shell: bash
        run: |
          python .github/scripts/record-auth-burger-rules.py
          python .github/scripts/implement-guest-foundation.py
          git config user.name "dc-organizer-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-auth-guest-foundation.yml
          git rm .github/scripts/record-auth-burger-rules.py
          git rm .github/scripts/implement-guest-foundation.py
          git add AGENTS.md README.md prd.md prd1.md prisma/schema.prisma prisma/migrations/20260917081500_add_guest_category_tags/migration.sql app/api/guests/route.ts app/api/guests/[id]/labels/route.ts
          git commit -m "feat: add RSVP protection and guest segmentation foundation"
          git push origin HEAD:main
