name: Record Landing Proof Burger Requirements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-landing-proof-burger.yml'
      - '.github/scripts/record_landing_proof_burger.py'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync product and implementation docs
        shell: bash
        run: |
          python .github/scripts/record_landing_proof_burger.py
          git config user.name "dc-organizer-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/record-landing-proof-burger.yml .github/scripts/record_landing_proof_burger.py
          git add prd.md AGENTS.md README.md prd-tambahan.md prd1.md
          git commit -m "docs: record burger and landing proof rules"
          git push origin HEAD:main
