name: Apply Dashboard Redesign

on:
  push:
    paths:
      - '.github/workflows/apply-dashboard-redesign.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dashboard redesign
        run: python .github/scripts/redesign-dashboard.py

      - name: Commit changes and clean temporary files
        run: |
          rm .github/scripts/redesign-dashboard.py
          rm .github/workflows/apply-dashboard-redesign.yml
          git config user.name "dc-organizer-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign dashboard hierarchy and header" || exit 0
          git push
