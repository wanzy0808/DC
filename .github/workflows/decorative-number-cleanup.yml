name: Decorative Content Number Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/decorative-number-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Remove remaining decorative sequence numbers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_str, old, new):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if not count:
                  raise SystemExit(f'Pattern not found in {path}: {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: {count} replacement(s)')

          replace(
              'app/event-planner/page.tsx',
              '{plannerPackages.map((item, index) => (',
              '{plannerPackages.map((item) => (',
          )
          replace(
              'app/event-planner/page.tsx',
              '                      Paket {String(index + 1).padStart(2, "0")}',
              '                      Paket',
          )

          replace(
              'components/WeddingPlanner/ServicesSection.tsx',
              '{plannerServices.map((service, index) => (',
              '{plannerServices.map((service) => (',
          )
          replace(
              'components/WeddingPlanner/ServicesSection.tsx',
              '''            <div className="flex items-center justify-between">\n              <span className="font-[family-name:var(--font-dc-mono)] text-xs text-[var(--primary)]">\n                0{index + 1}\n              </span>\n              <Check className="h-5 w-5 text-[var(--primary)]" />\n            </div>''',
              '''            <div className="flex justify-end">\n              <Check className="h-5 w-5 text-[var(--primary)]" />\n            </div>''',
          )

          replace(
              'components/GuestbookPage/FeatureSection.tsx',
              '''              <span className="flex items-center gap-4">\n                <span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-full border border-border font-[family-name:var(--font-dm-mono)] text-xs">\n                  {String(index + 1).padStart(2, "0")}\n                </span>\n                <span className="font-[family-name:var(--font-cinzel)] text-sm font-semibold md:text-base">\n                  {feature.title}\n                </span>\n              </span>''',
              '''              <span className="font-[family-name:var(--font-cinzel)] text-sm font-semibold md:text-base">\n                {feature.title}\n              </span>''',
          )

          replace(
              'components/Layout/Navbar/BurgerMenuContent.tsx',
              '{menuItems.slice(1).map(({ href, label, icon: Icon }, index) => (',
              '{menuItems.slice(1).map(({ href, label, icon: Icon }) => (',
          )
          replace(
              'components/Layout/Navbar/BurgerMenuContent.tsx',
              '''                <span className="flex items-center gap-4">\n                  <span className="font-[family-name:var(--font-dc-mono)] text-[10px] tracking-[0.16em] text-[var(--muted-foreground)]">\n                    {String(index + 4).padStart(2, "0")}\n                  </span>\n                  <Icon className="h-[18px] w-[18px] text-[var(--primary)]" />\n                </span>''',
              '''                <span className="flex items-center gap-4">\n                  <Icon className="h-[18px] w-[18px] text-[var(--primary)]" />\n                </span>''',
          )

          replace(
              'components/Dashboard/RsvpAnalyticsPanel.tsx',
              'const header = ["#", "Nama Tamu", "Telepon", "Status RSVP", "Pax", "Check In", "Meja"];',
              'const header = ["Nama Tamu", "Telepon", "Status RSVP", "Pax", "Check In", "Meja"];',
          )
          replace(
              'components/Dashboard/RsvpAnalyticsPanel.tsx',
              '...filtered.map((guest, index) => [\n        index + 1,',
              '...filtered.map((guest) => [',
          )
          replace(
              'components/Dashboard/RsvpAnalyticsPanel.tsx',
              '                <th className="px-3 py-3 font-medium">#</th>\n',
              '',
          )
          replace(
              'components/Dashboard/RsvpAnalyticsPanel.tsx',
              '{filtered.map((guest, index) => (',
              '{filtered.map((guest) => (',
          )
          replace(
              'components/Dashboard/RsvpAnalyticsPanel.tsx',
              '''                  <td className="px-3 py-3 font-[family-name:var(--font-dm-mono)] text-foreground/45">\n                    {String(index + 1).padStart(2, "0")}\n                  </td>\n''',
              '',
          )

          supplement = Path('prd-tambahan.md')
          text = supplement.read_text(encoding='utf-8').rstrip()
          text += '''\n\n## Decorative numbering audit follow-up\n- Audit lint-like review after the width cleanup found remaining presentational sequence numbers in Event Planner package cards, planner service cards, Guestbook feature tabs, burger navigation, and RSVP list/export rows.\n- Those sequence numbers are removed; the labels/content now stand on their own without `01`, `02`, `#`, or index-based decoration.\n- Functional numeric data remains untouched, including seating numbers, time picker hours/minutes, prices, dates, quotas, counts, child order, phone numbers, and template identifiers.\n'''
          supplement.write_text(text + '\n', encoding='utf-8')

          forbidden = {
              'app/event-planner/page.tsx': ['Paket {String(index + 1)', 'padStart(2'],
              'components/WeddingPlanner/ServicesSection.tsx': ['0{index + 1}'],
              'components/GuestbookPage/FeatureSection.tsx': ['String(index + 1).padStart'],
              'components/Layout/Navbar/BurgerMenuContent.tsx': ['String(index + 4).padStart'],
              'components/Dashboard/RsvpAnalyticsPanel.tsx': ['String(index + 1).padStart', '<th className="px-3 py-3 font-medium">#</th>'],
          }
          for path_str, patterns in forbidden.items():
              text = Path(path_str).read_text(encoding='utf-8')
              for pattern in patterns:
                  if pattern in text:
                      raise SystemExit(f'Remaining decorative numbering in {path_str}: {pattern}')
          print('Targeted decorative numbering cleanup guard: PASS')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build corrected source
        run: pnpm build

      - name: Commit implementation
        id: implementation
        shell: bash
        run: |
          git config user.name "dc-organizer-agent"
          git config user.email "actions@users.noreply.github.com"
          git add app/event-planner/page.tsx components/WeddingPlanner/ServicesSection.tsx components/GuestbookPage/FeatureSection.tsx components/Layout/Navbar/BurgerMenuContent.tsx components/Dashboard/RsvpAnalyticsPanel.tsx prd-tambahan.md
          git commit -m "fix: remove decorative content numbering"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record changelog
        env:
          IMPLEMENTATION_SHA: ${{ steps.implementation.outputs.sha }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          sha = os.environ['IMPLEMENTATION_SHA']
          path = Path('prd1.md')
          text = path.read_text(encoding='utf-8').rstrip()
          text += f'''\n\n---\n\n## 2026-09-17 — Decorative Content Numbering Follow-up\n\n### Requirement / Intent\nFinal audit menemukan beberapa sequence number presentasional yang masih tersisa di page/component non-dashboard. Sesuai arahan user, nomor urutan dekoratif tidak dipakai sebagai content UI. Nomor fungsional/data nyata tetap dipertahankan.\n\n### Implementation\n- menghapus `Paket 01/02/...` pada Event Planner;\n- menghapus nomor urut card pada planner services;\n- menghapus nomor urut tab fitur Guestbook;\n- menghapus nomor urut menu pada burger navigation;\n- menghapus kolom nomor urut `#` dari RSVP table dan CSV export;\n- tidak mengubah seat number, time picker, price, quota, metric, date/time, child order, phone, atau template identifier.\n\n### Commit\n- `{sha}` — remove remaining decorative sequence numbering.\n\n### Validation\n- targeted decorative-number guard: **PASS**.\n- `pnpm install --frozen-lockfile`: **PASS**.\n- `pnpm build`: **PASS**.\n- Database migration: N/A.\n'''
          path.write_text(text + '\n', encoding='utf-8')
          PY
          git add prd1.md
          git commit -m "docs: record decorative numbering cleanup"
          git push origin HEAD:main

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm -f .github/workflows/decorative-number-cleanup.yml
          git commit -m "chore: remove decorative number cleanup workflow"
          git push origin HEAD:main