name: Fix one-shot invitation updater

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-one-shot-invitation-updater.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch updater workflow
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/one-shot-invitation-family-time.yml')
          text = path.read_text()
          anchor = '''          replace_once(\n              "components/Dashboard/EventPanel.tsx",\n              '      {open && (\\n',\n              '      {open && !disabled && (\\n',\n          )\n\n          # API accepts a persisted END sentinel in the existing compatibility time field.\n'''
          replacement = '''          replace_once(\n              "components/Dashboard/EventPanel.tsx",\n              '      {open && (\\n',\n              '      {open && !disabled && (\\n',\n          )\n          replace_once(\n              "components/Dashboard/EventPanel.tsx",\n              '''        <Input\\n          disabled={disabled}\\n          inputMode="numeric"\\n          maxLength={10}\\n''',\n              '''        <Input\\n          inputMode="numeric"\\n          maxLength={10}\\n''',\n          )\n          replace_once(\n              "components/Dashboard/EventPanel.tsx",\n              '''        <Input\\n          inputMode="numeric"\\n          maxLength={5}\\n''',\n              '''        <Input\\n          disabled={disabled}\\n          inputMode="numeric"\\n          maxLength={5}\\n''',\n          )\n\n          # API accepts a persisted END sentinel in the existing compatibility time field.\n'''
          if anchor not in text:
              raise SystemExit('Updater anchor not found')
          path.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Commit updater fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-one-shot-invitation-updater.yml
          git add .github/workflows/one-shot-invitation-family-time.yml .github/workflows/fix-one-shot-invitation-updater.yml
          git commit -m "fix one-shot invitation updater"
          git push origin HEAD:main
