name: Apply Dashboard Redesign Build Fix

on:
  push:
    paths:
      - '.github/workflows/apply-dashboard-redesign-build-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply build fix
        run: python .github/scripts/fix-dashboard-redesign-build.py

      - name: Commit changes and clean temporary files
        run: |
          rm .github/scripts/fix-dashboard-redesign-build.py
          rm .github/workflows/apply-dashboard-redesign-build-fix.yml
          git config user.name "dc-organizer-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore dashboard stat helper" || exit 0
          git push
