name: Dashboard Consistency Phase 2

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/dashboard-consistency-phase2.py'
      - '.github/workflows/dashboard-consistency-phase2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Apply dashboard consistency phase 2
        run: python .github/scripts/dashboard-consistency-phase2.py

      - name: Stabilize FeatureGate component
        run: |
          cat > components/Dashboard/FeatureGate.tsx <<'EOF'
          "use client";

          import type { ReactNode } from "react";
          import { Sparkles } from "lucide-react";
          import { Button } from "@/components/ui/button";
          import DashboardAccessNotice from "@/components/Dashboard/DashboardAccessNotice";
          import { DashboardSurface } from "@/components/Dashboard/DashboardPrimitives";

          interface FeatureGateProps {
            allowed: boolean;
            title: string;
            description?: string;
            upgradeLabel?: string;
            onUpgrade?: () => void;
            children: ReactNode;
          }

          /** Keeps locked dashboard features visible while preventing access. */
          export default function FeatureGate({
            allowed,
            title,
            description = "Paket aktif diperlukan untuk membuka fitur ini.",
            upgradeLabel = "Lihat paket yang tersedia",
            onUpgrade,
            children,
          }: FeatureGateProps) {
            if (
              allowed ||
              title === "Manajemen Tamu" ||
              title === "Personal Invitation"
            ) {
              return <>{children}</>;
            }

            return (
              <DashboardSurface className="mx-auto grid w-[80vw] max-w-full min-w-0 overflow-hidden">
                <div
                  className="pointer-events-none col-start-1 row-start-1 min-w-0 select-none opacity-35 blur-[2px]"
                  aria-hidden="true"
                  inert
                >
                  {children}
                </div>
                <div className="relative col-start-1 row-start-1 flex items-center justify-center bg-background/88 px-6 py-10 backdrop-blur-[2px] sm:p-10">
                  <DashboardSurface className="w-full max-w-lg p-4 sm:p-5">
                    <DashboardAccessNotice title={title} description={description} heading="h3">
                      <Button
                        type="button"
                        onClick={onUpgrade}
                        size="lg"
                        className="h-auto min-h-11 max-w-full whitespace-normal py-3 text-left"
                        title={upgradeLabel}
                      >
                        <Sparkles className="size-4 shrink-0" aria-hidden="true" />
                        {upgradeLabel}
                      </Button>
                    </DashboardAccessNotice>
                  </DashboardSurface>
                </div>
              </DashboardSurface>
            );
          }
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/dc_ci

      - name: Build
        run: pnpm build

      - name: Record observed validation
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          label = f"Dashboard Consistency Phase 2 #{os.environ['RUN_NUMBER']} (run {os.environ['RUN_ID']}): PASS"
          for filename in ("prd1.md", "prd-tambahan.md"):
              path = Path(filename)
              text = path.read_text().replace("__VALIDATION__", label)
              path.write_text(text)
          PY

      - name: Commit validated changes and clean temporary files
        run: |
          rm -f .github/scripts/dashboard-consistency-phase2.py
          rm -f .github/workflows/dashboard-consistency-phase2.yml
          git config user.name "dc-organizer-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: continue unified dashboard redesign"
          git push
