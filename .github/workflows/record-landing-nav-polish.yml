name: Record Landing Navigation Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-landing-nav-polish.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record changelog and remove one-shot workflow
        shell: bash
        run: |
          echo '' | base64 -d >> prd1.md
          git config user.name "dc-organizer-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/record-landing-nav-polish.yml
          git add prd1.md
          git commit -m "docs: record landing and navigation polish"
          git push origin HEAD:main
