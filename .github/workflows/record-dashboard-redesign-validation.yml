name: Record Dashboard Redesign Validation

on:
  push:
    paths:
      - '.github/workflows/record-dashboard-redesign-validation.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record validation and clean temporary files
        run: |
          python .github/scripts/record-dashboard-redesign-validation.py
          rm .github/scripts/record-dashboard-redesign-validation.py
          rm .github/workflows/record-dashboard-redesign-validation.yml
          rm -f .github/dashboard-redesign-validation.txt
          git config user.name "dc-organizer-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: record dashboard redesign validation" || exit 0
          git push
