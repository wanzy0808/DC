name: Patch dashboard overview

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/[dashboard]/page.tsx')
          s = p.read_text()
          s = s.replace('CalendarDays, CheckCircle2, ChevronDown,', 'CalendarDays, CheckCircle2, ChevronDown, Home,')
          s = s.replace('type Context = { profile:{displayName:string;email:string}; wedding:{invitationId:string|null;groomName:string;brideName:string;title:string}; package:{key:string;status:string}; entitlements:{hasDigitalInvitation:boolean;hasGuestbook:boolean;canPublishInvitation:boolean;canUploadInvitationAssets:boolean;canUseGuestPlacement:boolean;canUseUsherApp:boolean} };', 'type Context = { profile:{displayName:string;email:string}; wedding:{invitationId:string|null;groomName:string;brideName:string;title:string}; package:{key:string;status:string}; overview:{invitationsCreated:number;invitationsLimit:number;totalRsvp:number;totalGuests:number;invitationsShared:number;invitationPublished:boolean}; entitlements:{hasDigitalInvitation:boolean;hasGuestbook:boolean;canPublishInvitation:boolean;canUploadInvitationAssets:boolean;canUseGuestPlacement:boolean;canUseUsherApp:boolean} };')
          s = s.replace('type Tab = "events"|"invitation"|"rsvp"|"placement"|"usher";', 'type Tab = "overview"|"events"|"invitation"|"rsvp"|"placement"|"usher";')
          s = s.replace('const nav=[\n {id:"events" as Tab,label:"Rangkaian Acara",icon:CalendarDays},', 'const nav=[\n {id:"overview" as Tab,label:"Beranda",icon:Home},\n {id:"events" as Tab,label:"Rangkaian Acara",icon:CalendarDays},')
          s = s.replace('{id:"placement" as Tab,label:"Penempatan Tamu",icon:Users,gate:"guestbook"}', '{id:"placement" as Tab,label:"Tamu Undangan",icon:Users,gate:"guestbook"}')
          s = s.replace('const [tab,setTab]=useState<Tab>("events");', 'const [tab,setTab]=useState<Tab>("overview");')
          old = '<nav className="flex-1 space-y-1 p-3"><Link href="/dashboard" className="mb-2 flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left font-[family-name:var(--font-cinzel)] text-[11px] font-semibold text-[#3F3030] hover:bg-[#7A1C25]/7 dark:text-[#F0E5E5] dark:hover:bg-white/5"><CalendarDays className="h-4 w-4"/><span>Beranda</span></Link><p className="px-3 pb-3 pt-3 font-[family-name:var(--font-cinzel)] text-[10px] font-semibold uppercase tracking-[0.2em] text-[#5A4545] dark:text-white/75">Workspace</p>{nav.map(item=>{'
          new = '<nav className="flex-1 space-y-1 p-3"><p className="px-3 pb-3 pt-3 font-[family-name:var(--font-cinzel)] text-[10px] font-semibold uppercase tracking-[0.2em] text-[#5A4545] dark:text-white/75">Workspace</p>{nav.map(item=>{'
          if old not in s: raise SystemExit('sidebar pattern not found')
          s = s.replace(old, new)
          s = s.replace('    <div className="flex h-16 items-center border-b border-[#ddd0c8] px-5 dark:border-white/10"><Link href="/" className="font-[family-name:var(--font-cinzel)] text-lg font-bold tracking-[0.18em] text-[#7A1C25] dark:text-[#E8A5AE]">DC Wedding</Link></div>\n', '')
          s = s.replace('<button className="rounded-lg p-2 lg:hidden" onClick={()=>setMobileOpen(v=>!v)} aria-label="Buka menu">{mobileOpen?<X className="h-5 w-5"/>:<Menu className="h-5 w-5"/>}</button><div className="hidden lg:block" />', '<button className="rounded-lg p-2 lg:hidden" onClick={()=>setMobileOpen(v=>!v)} aria-label="Buka menu">{mobileOpen?<X className="h-5 w-5"/>:<Menu className="h-5 w-5"/>}</button><Link href="/dashboard" className="font-[family-name:var(--font-cinzel)] text-base font-bold tracking-[0.16em] text-[#7A1C25] dark:text-[#E8A5AE]">DC Wedding</Link>')
          s = s.replace('     {tab==="events"&&<EventPanel', '     {tab==="overview"&&<WorkspaceOverview ctx={ctx} onGo={go} onUpgrade={()=>router.push("/packages")} accent={accent} button={button}/>} {tab==="events"&&<EventPanel')
          marker = 'function Stat({label,value,icon:Icon}:{label:string;value:string;icon:any})'
          component = '''function WorkspaceOverview({ctx,onGo,onUpgrade,accent,button}:{ctx:Context|null;onGo:(id:Tab)=>void;onUpgrade:()=>void;accent:string;button:string}){\n const overview=ctx?.overview; const packageKey=ctx?.package.key; const packageStatus=ctx?.package.status;\n const packageLabel=packageStatus==="PAID"?(packageKey==="INVITATION_GUESTBOOK"?"Digital Invitation + Guestbook":packageKey==="GUESTBOOK_DIGITAL"?"Guestbook Digital":"Digital Invitation"):"Belum ada paket aktif";\n return <div className="mx-auto max-w-6xl space-y-6 p-5 sm:p-8">\n  <section className="rounded-3xl border border-[#d9cbc2] bg-[#f3ede6] p-6 dark:border-white/10 dark:bg-[#121116] sm:p-8">\n   <p className={`font-[family-name:var(--font-cinzel)] text-xs font-semibold uppercase tracking-[.2em] ${accent}`}>Beranda Workspace</p>\n   <div className="mt-2 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">\n    <div><h1 className="font-[family-name:var(--font-fauna)] text-3xl sm:text-4xl">Welcome, {ctx?.profile.displayName||""}.</h1><p className="mt-2 font-[family-name:var(--font-fauna)] text-sm text-[#5A4545] dark:text-white/75">{ctx?.wedding?.groomName&&ctx?.wedding?.brideName?`${ctx.wedding.groomName} & ${ctx.wedding.brideName}`:"Lengkapi data pasanganmu untuk mulai menyiapkan wedding."}</p></div>\n    <div className="rounded-2xl border border-[#d8cbc2] bg-[#eee5dd] px-4 py-3 dark:border-white/10 dark:bg-white/[.04]"><p className="font-[family-name:var(--font-cinzel)] text-[10px] font-semibold uppercase tracking-[.16em] text-[#5A4545] dark:text-white/60">Paket aktif</p><p className="mt-1 font-[family-name:var(--font-fauna)] text-sm">{packageLabel}</p></div>\n   </div>\n  </section>\n  <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">\n   <Stat label="Undangan Dibagikan" value={String(overview?.invitationsShared??0)} icon={Mail}/>\n   <Stat label="Total RSVP" value={String(overview?.totalRsvp??0)} icon={MessageSquareHeart}/>\n   <Stat label="Undangan Dibuat" value={`${overview?.invitationsCreated??0}/${overview?.invitationsLimit??2}`} icon={Edit3}/>\n   <Stat label="Tamu / Pax" value={String(overview?.totalGuests??0)} icon={Users}/>\n  </div>\n  <Card className="p-6"><div className="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"><div><p className="font-[family-name:var(--font-cinzel)] text-xs font-semibold uppercase tracking-[.18em] text-[#5A4545] dark:text-white/60">Status Undangan</p><h2 className="mt-1 font-[family-name:var(--font-fauna)] text-2xl">{overview?.invitationPublished?"Undangan sudah dipublish":"Undangan belum dipublish"}</h2><p className="mt-1 font-[family-name:var(--font-fauna)] text-xs text-[#5A4545] dark:text-white/70">{overview?.invitationPublished?"Tamu sudah dapat mengakses undangan sesuai pengaturan paket.":"Edit template tetap bisa dilakukan. Publish akan mengikuti entitlement paket."}</p></div><Button onClick={()=>onGo("invitation")} className={`rounded-xl ${button} font-[family-name:var(--font-cinzel)] text-xs text-white`}>{overview?.invitationPublished?"Kelola Undangan":"Edit Undangan"}</Button></div></Card>\n  <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">\n   <QuickAction icon={CalendarDays} title="Rangkaian Acara" text="Atur tanggal, waktu, lokasi, dan detail acara." onClick={()=>onGo("events")} accent={accent}/>\n   <QuickAction icon={Mail} title="Undangan Digital" text="Buka Studio, template, password, dan link." onClick={()=>onGo("invitation")} accent={accent}/>\n   <QuickAction icon={MessageSquareHeart} title="RSVP" text="Pantau konfirmasi kehadiran dan pax." onClick={()=>onGo("rsvp")} accent={accent}/>\n   <QuickAction icon={Users} title="Tamu Undangan" text={ctx?.entitlements.hasGuestbook?"Atur meja dan kursi tamu.":"Fitur Guestbook terkunci."} onClick={()=>ctx?.entitlements.hasGuestbook?onGo("placement"):onUpgrade()} accent={accent} locked={!ctx?.entitlements.hasGuestbook}/>\n  </div>\n </div>}\nfunction QuickAction({icon:Icon,title,text,onClick,accent,locked=false}:{icon:any;title:string;text:string;onClick:()=>void;accent:string;locked?:boolean}){return <button onClick={onClick} className="group rounded-2xl border border-[#d9cbc2] bg-[#f3ede6] p-5 text-left transition hover:-translate-y-0.5 hover:shadow-md dark:border-white/10 dark:bg-[#121116]"><div className="flex items-center justify-between"><Icon className={`h-5 w-5 ${accent}`}/>{locked&&<LockKeyhole className="h-4 w-4 text-[#5A4545] dark:text-white/60"/>}</div><h3 className="mt-4 font-[family-name:var(--font-fauna)] text-lg">{title}</h3><p className="mt-1 font-[family-name:var(--font-fauna)] text-xs leading-5 text-[#5A4545] dark:text-white/70">{text}</p></button>}\n'''
          if marker not in s: raise SystemExit('stat marker not found')
          s = s.replace(marker, component + marker, 1)
          p.write_text(s)
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/[dashboard]/page.tsx'
          git commit -m "feat: make dashboard overview part of workspace"
          git rm .github/workflows/patch-dashboard-overview.yml
          git commit -m "chore: remove temporary dashboard overview patch workflow"
          git push
