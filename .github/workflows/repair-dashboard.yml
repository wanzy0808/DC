name: Repair dashboard merge conflict

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore clean dashboard file
        run: |
          git fetch origin main
          git checkout 6446fb25839f86586562f49d5eb9e7d69b96682a5 -- 'app/[dashboard]/page.tsx'
          if grep -nE '^(<<<<<<<|=======|>>>>>>> )' 'app/[dashboard]/page.tsx'; then
            echo 'Conflict markers remain after restore' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/[dashboard]/page.tsx'
          git commit -m 'Fix dashboard merge conflict' || exit 0
          git push origin HEAD:main
