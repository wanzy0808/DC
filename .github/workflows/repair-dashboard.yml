name: Repair dashboard source

on:
  push:
    paths:
      - .github/workflows/repair-dashboard.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore dashboard page
        run: |
          git checkout 6446fb25839f86586562f49d5eb9e7d69b96682a -- 'app/[dashboard]/page.tsx'
          rm -f .github/workflows/repair-dashboard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/[dashboard]/page.tsx' .github/workflows/repair-dashboard.yml
          git commit -m 'Fix dashboard merge conflict' || exit 0
          git push
