name: Fix dashboard navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: restore dashboard Beranda navigation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/[dashboard]/page.tsx')
          text = path.read_text()

          text = text.replace(
              'import { useRouter } from "next/navigation";',
              'import { usePathname, useRouter } from "next/navigation";'
          )
          text = text.replace(
              'CalendarDays, CheckCircle2,',
              'CalendarDays, CheckCircle2, House,'
          )
          text = text.replace(
              ' const router=useRouter(); const {isDarkMode}=useTheme();',
              ' const router=useRouter(); const pathname=usePathname(); const {isDarkMode}=useTheme();'
          )
          text = text.replace(
              ' const canDigital=ctx?.entitlements.hasDigitalInvitation??false; const canGuestbook=ctx?.entitlements.hasGuestbook??false; const accent=isDarkMode?"text-[#E8A5AE]":"text-[#7A1C25]"; const button=isDarkMode?"bg-[#C26B70] hover:bg-[#A9565C]":"bg-[#7A1C25] hover:bg-[#5E141C]"; const surface=isDarkMode?"bg-[#0B0A0E]":"bg-[#FAF7F2]"; const title=nav.find(n=>n.id===tab)?.label??"Rangkaian Acara";',
              ' const canDigital=ctx?.entitlements.hasDigitalInvitation??false; const canGuestbook=ctx?.entitlements.hasGuestbook??false; const accent=isDarkMode?"text-[#E8A5AE]":"text-[#7A1C25]"; const button=isDarkMode?"bg-[#C26B70] hover:bg-[#A9565C]":"bg-[#7A1C25] hover:bg-[#5E141C]"; const surface=isDarkMode?"bg-[#0B0A0E]":"bg-[#FAF7F2]";'
          )
          old_nav = '<nav className="flex-1 space-y-1 p-3"><p className="px-3 pb-3 pt-3 font-[family-name:var(--font-cinzel)] text-[10px] font-semibold uppercase tracking-[0.2em] text-[#5A4545] dark:text-white/75">Workspace</p>{nav.map(item=>{const Icon=item.icon;const locked=item.gate==="guestbook"&&!canGuestbook;return <button key={item.id} onClick={()=>go(item.id)} className={`flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left font-[family-name:var(--font-cinzel)] text-[11px] font-semibold transition ${tab===item.id?"bg-[#7A1C25]/10 text-[#7A1C25] dark:bg-[#E8A5AE]/10 dark:text-[#E8A5AE]":"text-[#3F3030] hover:bg-[#7A1C25]/7 dark:text-[#F0E5E5] dark:hover:bg-white/5"}`}><Icon className="h-4 w-4"/><span>{item.label}</span>{locked&&<GateLabel/>}</button>})}</nav>'
          new_nav = '<nav className="flex-1 space-y-1 p-3"><Link href="/dashboard" className={`flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left font-[family-name:var(--font-cinzel)] text-[11px] font-semibold transition ${pathname==="/dashboard"?"bg-[#7A1C25]/10 text-[#7A1C25] dark:bg-[#E8A5AE]/10 dark:text-[#E8A5AE]":"text-[#3F3030] hover:bg-[#7A1C25]/7 dark:text-[#F0E5E5] dark:hover:bg-white/5"}`}><House className="h-4 w-4"/><span>Beranda</span></Link><p className="px-3 pb-3 pt-3 font-[family-name:var(--font-cinzel)] text-[10px] font-semibold uppercase tracking-[0.2em] text-[#5A4545] dark:text-white/75">Workspace</p>{nav.map(item=>{const Icon=item.icon;const locked=item.gate==="guestbook"&&!canGuestbook;return <button key={item.id} onClick={()=>go(item.id)} className={`flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left font-[family-name:var(--font-cinzel)] text-[11px] font-semibold transition ${tab===item.id?"bg-[#7A1C25]/10 text-[#7A1C25] dark:bg-[#E8A5AE]/10 dark:text-[#E8A5AE]":"text-[#3F3030] hover:bg-[#7A1C25]/7 dark:text-[#F0E5E5] dark:hover:bg-white/5"}`}><Icon className="h-4 w-4"/><span>{item.label}</span>{locked&&<GateLabel/>}</button>})}</nav>'
          if old_nav not in text:
              raise SystemExit('sidebar nav pattern not found')
          text = text.replace(old_nav, new_nav, 1)

          old_header = '<div className="hidden font-[family-name:var(--font-cinzel)] text-sm font-semibold tracking-[0.08em] text-[#7A1C25] dark:text-[#E8A5AE] lg:block">{title}</div>'
          if old_header not in text:
              raise SystemExit('header title pattern not found')
          text = text.replace(old_header, '', 1)

          old_main_title = '<main><div className="border-b border-[#ddd0c8] px-5 py-4 dark:border-white/10 sm:px-8"><p className="font-[family-name:var(--font-cinzel)] text-[10px] font-semibold uppercase tracking-[0.2em] text-[#5A4545] dark:text-white/75">DC Wedding Workspace</p><h1 className="mt-1 font-[family-name:var(--font-fauna)] text-xl font-medium">{title}</h1></div>'
          if old_main_title not in text:
              raise SystemExit('main title pattern not found')
          text = text.replace(old_main_title, '<main>', 1)

          path.write_text(text)
          PY

      - name: Verify patch
        run: |
          grep -q 'href="/dashboard"' 'app/[dashboard]/page.tsx'
          grep -q '<span>Beranda</span>' 'app/[dashboard]/page.tsx'
          if grep -q 'DC Wedding Workspace' 'app/[dashboard]/page.tsx'; then exit 1; fi
          if grep -q '>{title}</h1>' 'app/[dashboard]/page.tsx'; then exit 1; fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/[dashboard]/page.tsx'
          git commit -m 'fix: restore dashboard Beranda navigation'
          git push