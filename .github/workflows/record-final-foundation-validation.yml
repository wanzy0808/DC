name: Record Final Foundation Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-final-foundation-validation.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record validation and clean marker
        shell: bash
        run: |
          echo '' | base64 -d >> prd1.md
          git config user.name "dc-organizer-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/final-source-validation.txt
          git rm .github/workflows/record-final-foundation-validation.yml
          git add prd1.md
          git commit -m "docs: record guest foundation validation"
          git push origin HEAD:main
